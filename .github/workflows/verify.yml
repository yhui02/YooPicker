name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / test / dist 同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # dist/ 随仓库提交，供 git 引用方直接使用：
      # 这里重新构建并校验产物与仓库中的一致，防止改了 src 忘记 build。
      - name: 校验 dist 与 src 同步
        run: bash scripts/check-dist.sh
